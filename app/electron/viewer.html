<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>Recall Briefing</title>
  <link rel="stylesheet" href="./viewer.css" />
  <script src="./viewer.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 Recall Briefing</h1>
      <p id="briefing-date">Today</p>
    </div>

    <div class="content">
      <div class="danger-zone">
        <button class="danger-button" data-action="delete-all">Delete everything</button>
      </div>
      <div class="tabs">
        <button class="tab-button active" data-tab="briefing">Briefing</button>
        <button class="tab-button" data-tab="activities">Activities</button>
      </div>

      <div id="briefing" class="tab-content active">
        <div class="loading">Loading briefing...</div>
      </div>

      <div id="activities" class="tab-content">
        <div class="filters">
          <button class="filter-button active" data-filter="all">All</button>
          <button class="filter-button" data-filter="app">App Changes</button>
          <button class="filter-button" data-filter="session">Sessions</button>
          <button class="filter-button" data-filter="app-list">Snapshots</button>
          <button class="filter-button" data-filter="window">Windows</button>
          <button class="filter-button" data-filter="clipboard">Clipboard</button>
        </div>
        <div class="summary-grid" id="activity-summary"></div>
        <div class="activities-grid" id="activities-list">
          <div class="loading">Loading activities...</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>🔒 All data is stored locally on your machine. Never synced or shared.</p>
    </div>
  </div>
</body>
</html>
