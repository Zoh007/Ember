name: Release desktop downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Install Electron dependencies
        run: npm install

      - name: Run Python tests
        run: npm test

      - name: Package desktop app
        run: npm run package

      - name: Archive app on macOS/Linux
        if: runner.os != 'Windows'
        run: |
          cd release
          zip -r "../Recall-${{ runner.os }}.zip" .

      - name: Archive app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath "Recall-${{ runner.os }}.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recall-${{ runner.os }}
          path: Recall-${{ runner.os }}.zip

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Recall-${{ runner.os }}.zip
