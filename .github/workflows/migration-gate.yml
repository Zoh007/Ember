name: Migration gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  migration_gate:
    name: Migration gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install SQLCipher wheel (or fallback)
        run: |
          python -m pip install sqlcipher3-binary || python -m pip install sqlcipher3

      - name: Verify SQLCipher import
        run: |
          python - <<'PY'
import sys
try:
    import sqlcipher3
except Exception as e:
    print('SQLCipher import failed:', e)
    sys.exit(2)
print('SQLCipher import OK')
PY

      - name: Create a plaintext SQLite DB
        env:
          TEST_DB: ${{ github.workspace }}/test_migrate.sqlite3
        run: |
          python - <<'PY'
import sqlite3, os
path = os.environ['TEST_DB']
if os.path.exists(path):
    os.remove(path)
conn = sqlite3.connect(path)
conn.execute('CREATE TABLE test_migrate (id INTEGER PRIMARY KEY);')
conn.execute('INSERT INTO test_migrate (id) VALUES (1);')
conn.commit()
conn.close()
print('Created test DB at', path)
PY

      - name: Run migration (strict)
        env:
          RECALL_DB_PATH: ${{ github.workspace }}/test_migrate.sqlite3
        run: |
          python -m recall_ai.cli migrate-db --yes
