name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Install SQLCipher wheel and verify
        run: |
          python -m pip install --upgrade pip
          # Prefer the prebuilt wheel; fall back to source-backed package if wheel not available
          python -m pip install sqlcipher3-binary || python -m pip install sqlcipher3
          python - <<'PY'
import importlib, sys
try:
    import sqlcipher3
except Exception as e:
    print('SQLCipher import failed:', e)
    sys.exit(2)
print('SQLCipher import OK')
PY

      - name: Migration smoke test
        run: python -m pytest tests/test_migration.py -v


      - name: Install Electron dependencies
        run: npm install

      - name: Run Python tests
        run: npm test

      - name: Package desktop app
        run: npm run package

      - name: Packaging check — SQLCipher present
        run: npm run check:package:sqlcipher

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ember-${{ runner.os }}
          path: release/*
