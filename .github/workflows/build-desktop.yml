name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pytest
        run: python -m pip install pytest

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Install SQLCipher wheel and verify
        run: |
          python -m pip install --upgrade pip
          # Prefer the prebuilt wheel; fall back to source-backed package if wheel not available
          python -m pip install sqlcipher3-binary || python -m pip install sqlcipher3
          python -c "import importlib; importlib.import_module('sqlcipher3'); print('SQLCipher import OK')"

      - name: Create migration test (CI-only)
        run: |
          python - <<'PY'
          import pathlib
          content = r'''
import os
import sqlite3
import subprocess
import sys
import tempfile


def test_migration_creates_encrypted_db():
    with tempfile.TemporaryDirectory() as tmp:
        db = os.path.join(tmp, "recall.sqlite3")
        conn = sqlite3.connect(db)
        conn.execute("CREATE TABLE t (id INTEGER PRIMARY KEY)")
        conn.execute("INSERT INTO t (id) VALUES (1)")
        conn.commit()
        conn.close()

        # Run the migration CLI against the plaintext DB
        res = subprocess.run([sys.executable, "-m", "recall_ai.cli", "migrate-db", "--yes", "--db", db], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
        assert res.returncode == 0, f"Migration failed: {res.stdout}\n{res.stderr}"

        # After migration, opening with the builtin sqlite3 should fail (file is encrypted)
        script = f"""
import sqlite3, sys
try:
    with sqlite3.connect('file:{db}?mode=ro', uri=True) as c:
        c.execute('SELECT name FROM sqlite_master LIMIT 1').fetchone()
except sqlite3.DatabaseError:
    sys.exit(0)
sys.exit(1)
"""
        res2 = subprocess.run([sys.executable, "-c", script], check=False)
        assert res2.returncode == 0, "DB appears plaintext after migration"

'''
          p = pathlib.Path('tests')
          p.mkdir(parents=True, exist_ok=True)
          p.joinpath('test_migration.py').write_text(content)
          print('Wrote tests/test_migration.py')
          PY

      - name: Migration smoke test
        run: python -m pytest tests/test_migration.py -v


      - name: Install Electron dependencies
        run: npm install

      - name: Run Python tests
        run: npm test

      - name: Package desktop app
        run: npm run package

      - name: Packaging check — SQLCipher present
        run: npm run check:package:sqlcipher

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ember-${{ runner.os }}
          path: release/*
